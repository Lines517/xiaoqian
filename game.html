<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="game.webmanifest">
<title>璀璨野心家 · 主播文游</title>
<style>
:root{
  --bg:#0b0a14; --panel:#161327; --panel2:#1e1a33; --line:#2b2443;
  --text:#ece8f5; --dim:#9a92b5; --gold:#ffd479; --pink:#ff8fc7;
  --violet:#a98cff; --ok:#7ee0a8; --bad:#ff7a8a; --cyan:#6fd3ff;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{
  background:radial-gradient(120% 60% at 50% 0%,#1b1533 0%,#0b0a14 55%,#07060d 100%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.6; overflow:hidden;
}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.45}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}

header{
  padding:calc(var(--safe-top) + 8px) 12px 8px; flex:0 0 auto;
  background:linear-gradient(180deg,rgba(22,19,39,.97),rgba(22,19,39,.72));
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
}
.hd-top{display:flex;align-items:center;gap:7px}
.hd-name{font-weight:700;font-size:15px;flex:0 0 auto}
.hd-stage{font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;
  background:linear-gradient(90deg,rgba(169,140,255,.28),rgba(255,143,199,.28));
  border:1px solid rgba(169,140,255,.45);color:#e7dcff;white-space:nowrap}
.hd-day{margin-left:auto;font-size:11px;color:var(--dim);white-space:nowrap}
.meta{display:flex;gap:5px;margin-top:7px;overflow-x:auto;scrollbar-width:none}
.meta::-webkit-scrollbar{display:none}
.mp{flex:0 0 auto;background:#1a1630;border:1px solid var(--line);border-radius:9px;padding:4px 9px;font-size:11px;white-space:nowrap}
.mp b{font-variant-numeric:tabular-nums;font-weight:700}
.mp.g b{color:var(--gold)} .mp.v b{color:var(--violet)} .mp.c b{color:var(--ok)}
.mp.p b{color:var(--pink)} .mp.y b{color:var(--cyan)}
.guild{flex:0 0 auto;background:linear-gradient(90deg,rgba(255,212,121,.14),rgba(169,140,255,.14));
  border:1px solid rgba(255,212,121,.3);border-radius:9px;padding:4px 9px;font-size:11px;color:#ffe6ac;white-space:nowrap}

main{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 190px}
.page{display:none}
.page.on{display:block}
.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:11px}
.card h3{margin:0 0 10px;font-size:12.5px;font-weight:700;color:var(--gold);letter-spacing:.6px;display:flex;align-items:center;gap:6px}
.card h3 .r{margin-left:auto;font-size:10.5px;color:var(--dim);font-weight:400;letter-spacing:0;text-align:right}
.tiny{font-size:11px;color:var(--dim);line-height:1.65}
.hr{height:1px;background:var(--line);margin:12px 0}

.turn{margin-bottom:16px;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.byme{display:flex;justify-content:flex-end;margin-bottom:15px}
.byme span{background:linear-gradient(135deg,#5b3ba8,#8e3d74);color:#fff;padding:9px 14px;border-radius:15px 15px 4px 15px;
  font-size:13.5px;max-width:82%;white-space:pre-wrap;box-shadow:0 6px 18px -10px #8e3d74}
.nar{font-size:14px;color:#ded7f2;white-space:pre-wrap;line-height:1.78;letter-spacing:.15px}
.sysbox{background:rgba(169,140,255,.1);border:1px solid rgba(169,140,255,.32);border-radius:12px;padding:9px 12px;
  font-size:12.5px;color:#ddd0ff;white-space:pre-wrap;margin:9px 0;line-height:1.65}
.hint{background:rgba(111,211,255,.09);border:1px solid rgba(111,211,255,.3);border-radius:12px;padding:9px 12px;
  font-size:12.5px;color:#bfe9ff;margin:9px 0;cursor:pointer;display:flex;align-items:center;gap:8px}
.hint:active{filter:brightness(1.3)}
.hint .badge{margin-left:auto;background:#ff3b5c;color:#fff;font-size:10px;border-radius:20px;padding:1px 7px;font-weight:700}
.dlt{font-size:11px;color:var(--ok);background:rgba(126,224,168,.09);border:1px dashed rgba(126,224,168,.3);
  border-radius:10px;padding:5px 10px;margin:8px 0;display:inline-block}
.typ{display:inline-flex;gap:4px;padding:10px 0}
.typ i{width:6px;height:6px;border-radius:50%;background:var(--violet);display:block;animation:ty 1s infinite}
.typ i:nth-child(2){animation-delay:.15s} .typ i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{appearance:none;border:1px solid var(--line);border-radius:14px;padding:12px 9px;
  background:linear-gradient(180deg,#241f3d,#1b1730);color:var(--text);
  font-size:13px;font-weight:600;font-family:inherit;text-align:center;cursor:pointer;
  transition:transform .1s,filter .15s;min-height:52px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.btn:active{transform:scale(.96);filter:brightness(1.25)}
.btn .ico{font-size:16px;line-height:1.1}
.btn small{font-size:9.5px;color:var(--dim);font-weight:400;line-height:1.35}
.btn.gold{background:linear-gradient(135deg,#c99b2e,#ffd479);border-color:transparent;color:#241a04;box-shadow:0 6px 18px -8px #ffd479}
.btn.pri{background:linear-gradient(135deg,#7a4fd6,#c94f9b);border-color:transparent;box-shadow:0 6px 18px -8px #c94f9b}
.btn.wide{grid-column:1/-1;min-height:46px;flex-direction:row;gap:7px}
.btn:disabled{opacity:.36;filter:grayscale(.65)}

.st{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.sx{background:#1c1832;border:1px solid var(--line);border-radius:12px;padding:8px 9px;text-align:center}
.sx .k{font-size:9.5px;color:var(--dim)}
.sx .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}

.row{display:flex;align-items:center;gap:10px;padding:9px 10px;background:#1c1832;border:1px solid var(--line);border-radius:13px;margin-bottom:7px}
.row .ic{font-size:19px;width:30px;text-align:center;flex:0 0 auto}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:12.5px}
.row .tx span{font-size:10px;color:var(--dim);display:block;line-height:1.4}
.grd{flex:0 0 auto;font-size:11px;font-weight:800;padding:3px 9px;border-radius:9px;letter-spacing:.5px}
.gC{background:#2b2547;color:#a49cc4} .gB{background:rgba(111,211,255,.16);color:#8fdcff}
.gA{background:rgba(169,140,255,.22);color:#c9b4ff} .gS{background:linear-gradient(135deg,#c99b2e,#ffd479);color:#241a04}

.tl{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
.tl:active{background:rgba(255,255,255,.04)}
.tl .av{width:44px;height:44px;flex:0 0 auto;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.tl .md{flex:1;min-width:0}
.tl .md b{font-size:13.5px;display:flex;align-items:center;gap:5px}
.tl .md span{font-size:11.5px;color:var(--dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tl .rt{flex:0 0 auto;text-align:right;font-size:10px;color:var(--dim)}
.tl .rt .un{display:inline-block;background:#ff3b5c;color:#fff;font-size:10px;border-radius:20px;padding:1px 7px;font-weight:700;margin-top:4px}
.gtag{font-size:9px;padding:1px 6px;border-radius:20px;background:rgba(126,224,168,.16);color:#9fe9c1;font-weight:600}

#threadHead{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line);
  background:rgba(22,19,39,.95);position:sticky;top:0;z-index:5}
#threadHead button{background:none;border:none;color:var(--gold);font-size:20px;font-family:inherit;cursor:pointer;padding:0 4px}
#threadHead .t{flex:1;min-width:0}
#threadHead .t b{font-size:14px;display:block}
#threadHead .t span{font-size:10px;color:var(--dim)}

.msg{display:flex;gap:8px;margin-bottom:12px;align-items:flex-end}
.msg .av{width:32px;height:32px;flex:0 0 auto;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.msg .bb{max-width:76%}
.msg .who{font-size:10px;color:var(--dim);margin-bottom:3px}
.msg .bx{background:#241f3d;border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:9px 13px;font-size:13.5px;white-space:pre-wrap;line-height:1.6}
.msg.me{flex-direction:row-reverse}
.msg.me .bb{text-align:right}
.msg.me .bx{background:linear-gradient(135deg,#5b3ba8,#8e3d74);border-color:transparent;color:#fff;border-radius:14px 4px 14px 14px;text-align:left}

#bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:520px;margin:0 auto;
  background:linear-gradient(180deg,rgba(20,17,35,.94),rgba(13,11,24,.99));backdrop-filter:blur(14px);border-top:1px solid var(--line)}
#composer{display:none;gap:8px;padding:9px 10px 6px;align-items:flex-end}
#composer.on{display:flex}
#inp{flex:1;font-family:inherit;font-size:14.5px;background:#120f22;border:1px solid #3b3260;color:var(--text);
  padding:10px 13px;border-radius:19px;outline:none;resize:none;max-height:104px;line-height:1.45;min-height:41px}
#inp:focus{border-color:var(--violet)}
#send{flex:0 0 auto;width:62px;height:41px;border-radius:19px;border:none;font-family:inherit;font-size:13px;font-weight:700;
  background:linear-gradient(135deg,#7a4fd6,#c94f9b);color:#fff;cursor:pointer}
#send:disabled{background:#2b2547;color:#5d5680}
#nav{display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(var(--safe-bot) + 6px)}
#nav button{appearance:none;background:none;border:none;color:var(--dim);font-family:inherit;font-size:10px;
  padding:5px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
#nav button i{font-size:18px;font-style:normal;line-height:1;transition:transform .15s}
#nav button.on{color:var(--gold)}
#nav button.on i{transform:translateY(-2px) scale(1.12)}
#nav button .nb{position:absolute;top:1px;right:calc(50% - 22px);background:#ff3b5c;color:#fff;font-size:9px;
  border-radius:20px;padding:0 5px;font-weight:700;min-width:15px}

#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none;width:max-content;max-width:90vw}
.tst{background:rgba(30,26,51,.97);border:1px solid var(--line);border-left:3px solid var(--violet);color:#ece8f5;font-size:12.5px;padding:9px 14px;border-radius:11px;box-shadow:0 12px 30px -12px #000;animation:tIn .3s ease}
.tst.g{border-left-color:var(--gold)} .tst.ok{border-left-color:var(--ok)} .tst.b{border-left-color:var(--bad)}
@keyframes tIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.modal{position:fixed;inset:0;z-index:80;background:rgba(5,4,10,.8);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:18px}
.modal.on{display:flex}
.mbox{width:100%;max-width:410px;max-height:84dvh;overflow-y:auto;
  background:linear-gradient(180deg,#1d1834,#161328);border:1px solid #3b3260;border-radius:19px;
  padding:19px;box-shadow:0 24px 60px -18px #000;animation:mIn .28s cubic-bezier(.2,1.1,.4,1)}
@keyframes mIn{from{opacity:0;transform:scale(.93) translateY(14px)}to{opacity:1;transform:none}}
.mbox h2{margin:0 0 4px;font-size:16.5px}
.mbox .sub{font-size:11.5px;color:var(--dim);margin-bottom:13px}
.mbox p{font-size:13.5px;color:#d5cdea;margin:0 0 13px;white-space:pre-wrap;line-height:1.65}
.mbox .out{font-size:13px;color:#e6e0ff;white-space:pre-wrap;line-height:1.75;margin:0 0 13px;
  background:#141124;border:1px solid var(--line);border-radius:12px;padding:12px;max-height:44dvh;overflow-y:auto}
.mopt{display:block;width:100%;text-align:left;font-family:inherit;font-size:13.5px;background:#241f3d;
  border:1px solid var(--line);color:var(--text);padding:12px 14px;border-radius:13px;margin-bottom:7px;cursor:pointer}
.mopt:active{transform:scale(.98)}
.mopt:last-child{margin-bottom:0}
.inp{width:100%;font-family:inherit;font-size:15px;background:#120f22;border:1px solid #3b3260;color:var(--text);
  padding:11px 13px;border-radius:13px;outline:none;margin-bottom:11px}
textarea.inp{font-size:13.5px;min-height:110px;resize:vertical;line-height:1.6}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:20px;background:rgba(169,140,255,.18);border:1px solid rgba(169,140,255,.35);color:#ddd0ff;margin:0 4px 4px 0}
.tag.ok{background:rgba(126,224,168,.15);border-color:rgba(126,224,168,.35);color:#bff0d4}
.tag.b{background:rgba(255,122,138,.14);border-color:rgba(255,122,138,.35);color:#ffb3bd}
.empty{text-align:center;color:var(--dim);font-size:12.5px;padding:26px 10px}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div id="app">
  <header>
    <div class="hd-top">
      <span class="hd-name" id="hName">—</span>
      <span class="hd-stage" id="hStage">语音厅</span>
      <span class="hd-day" id="hDay">第 1 天</span>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <main id="main">
    <section class="page on" id="p-story">
      <div id="story"></div>
    </section>

    <section class="page" id="p-sys">
      <div class="card">
        <h3>✦ 系统面板 <span class="r" id="sysStage"></span></h3>
        <div class="st">
          <div class="sx"><div class="k">人气</div><div class="v" id="vPop">0</div></div>
          <div class="sx"><div class="k">颜值</div><div class="v" id="vFace">12</div></div>
          <div class="sx"><div class="k">才艺</div><div class="v" id="vArt">6</div></div>
          <div class="sx"><div class="k">音色</div><div class="v" id="vVoice">10</div></div>
          <div class="sx"><div class="k">声望</div><div class="v" id="vFame">0</div></div>
          <div class="sx"><div class="k">伪装度</div><div class="v" id="vDis">80</div></div>
        </div>
        <div class="hr"></div>
        <div class="tiny" id="sysNote"></div>
      </div>

      <div class="card">
        <h3>🎴 系统抽取 <span class="r">颜值 / 才艺 / 音色 只能靠抽</span></h3>
        <div class="tiny" style="margin-bottom:10px" id="drawNote"></div>
        <div class="grid">
          <button class="btn gold" id="d1"><span class="ico">🎴</span>抽 1 次 <small id="d1c">200 情绪值</small></button>
          <button class="btn pri" id="d10"><span class="ico">🎊</span>抽 10 次 <small>2000 情绪值 · 保底 A 级</small></button>
        </div>
        <div class="hr"></div>
        <div class="tiny"><b class="gold2">已学课程</b></div>
        <div id="learned" class="tiny" style="margin-top:5px"></div>
      </div>

      <div class="card">
        <h3>🎒 背包</h3>
        <div id="bag" class="tiny"></div>
      </div>

      <div class="card">
        <h3>💠 目标 <span class="r" id="tgtInfo"></span></h3>
        <div class="tiny" style="margin-bottom:9px">直播认识、私信聊过的人会自动进这里。探查 1 万财富值，绑定前 3 个免费，入梦 10 万财富值。</div>
        <div id="tgts"></div>
      </div>
    </section>

    <section class="page" id="p-dm">
      <div id="dmListWrap">
        <div class="card">
          <h3>💬 私信 <span class="r" id="dmInfo"></span></h3>
          <div class="grid">
            <button class="btn wide" id="newGroup"><span class="ico">👥</span>建一个群 <small>粉丝群 / 主播互助群</small></button>
          </div>
        </div>
        <div id="dmList"></div>
      </div>
      <div id="dmThread" style="display:none">
        <div id="threadHead">
          <button id="backBtn">‹</button>
          <div class="t"><b id="thName">—</b><span id="thSub"></span></div>
        </div>
        <div id="threadMsgs" style="padding:12px 0"></div>
      </div>
    </section>

    <section class="page" id="p-save">
      <div class="card">
        <h3>💾 存档</h3>
        <div class="tiny">每次操作都会自动存在本机浏览器里。<br>但手机清缓存 / iOS 超过 7 天没开 → 可能丢。<br><b class="gold2">建议每周导一次存档码</b>，粘到备忘录里。</div>
        <div class="hr"></div>
        <div class="grid">
          <button class="btn gold wide" id="a-export"><span class="ico">📤</span>导出存档码</button>
          <button class="btn wide" id="a-import"><span class="ico">📥</span>导入存档码</button>
          <button class="btn wide" id="a-rename"><span class="ico">✏️</span>改名字</button>
          <button class="btn wide" id="a-reset" style="border-color:rgba(255,122,138,.4)"><span class="ico">🗑</span>重开一局</button>
        </div>
        <div class="hr"></div>
        <div class="tiny" id="saveMeta">—</div>
      </div>
      <div class="card">
        <h3>🤖 AI 引擎</h3>
        <div class="tiny" style="margin-bottom:9px" id="aiState"></div>
        <div class="grid">
          <button class="btn wide" id="a-aiMode"><span class="ico">🔀</span>切换 AI 通道</button>
          <button class="btn wide" id="a-aiTest"><span class="ico">🧪</span>测试连通</button>
        </div>
        <div class="hr"></div>
        <div class="tiny">没接 AI 也能玩，会用本地规则续写，但会比较笨。<br>接了 AI，你写什么它就演什么。</div>
      </div>
      <div class="card">
        <h3>📖 怎么玩</h3>
        <div class="tiny" id="helpBox"></div>
      </div>
    </section>
  </main>

  <div id="bottom">
    <div id="composer">
      <textarea id="inp" rows="1" placeholder="你要做什么、说什么……"></textarea>
      <button id="send">发送</button>
    </div>
    <nav id="nav">
      <button data-page="story" class="on"><i>📖</i>剧情</button>
      <button data-page="sys"><i>✦</i>系统</button>
      <button data-page="dm"><i>💬</i>私信</button>
      <button data-page="save"><i>💾</i>存档</button>
    </nav>
  </div>
</div>

<div id="toast"></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

function ri(a,b){ return Math.floor(a + Math.random()*(b-a+1)); }
function rnd(a,b){ return a + Math.random()*(b-a); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function esc(x){ return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function nf(n){
  n = Math.floor(n||0);
  if(n >= 100000000) return (n/100000000).toFixed(1)+"亿";
  if(n >= 10000) return (n/10000).toFixed(n<100000?2:1)+"万";
  return String(n);
}

function hhmm(t){
  var d = new Date(t||Date.now());

}
function hashOf(str){
  var h = 0;
  for(var i=0;i<String(str).length;i++){ h = (h*31 + String(str).charCodeAt(i)) | 0; }
  return Math.abs(h);
}

function b64e(str){
  var bytes = new TextEncoder().encode(str), bin = "";
  for(var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64d(b64){
  var bin = atob(b64), bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function toast(msg, cls){

  setTimeout(function(){
    el.style.transition = "opacity .3s";
    el.style.opacity = "0";
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 320);
  }, 2200);
  while(box.children.length > 4) box.removeChild(box.firstChild);
}

function pickGrade(pityBoost){
  var w = GRADE_W.slice();
  if(pityBoost) { w[0] = 0; w[3] = Math.max(w[3], 12); }
  var tot = w.reduce(function(a,b){ return a+b; },0);
  var r = Math.random()*tot;
  for(var i=0;i<w.length;i++){ r -= w[i]; if(r <= 0) return GRADES[i]; }
  return "C";
}
function drawOne(force, pityBoost){
  var isItem = Math.random() < 0.34;
  if(force) return {kind:"course", c:COURSES[0], grade:"C"};
  if(isItem){ return {kind:"extra", e: pick(EXTRAS)}; }
  return {kind:"course", c: pick(COURSES), grade: pickGrade(pityBoost)};
}
function applyDraw(d){
  if(d.kind === "extra"){
    s.items[d.e.n] = (s.items[d.e.n]||0) + 1;
    if(d.e.n === "热搜卡"){ s.pop += Math.floor(s.pop*0.5) + 3000; }
    if(d.e.n === "流量包"){ s.pop += Math.floor(s.pop*0.2) + 800; }
    if(d.e.n === "清醒剂"){ s.mood += 200; }
    return d.e.ic + " " + d.e.n;
  }
  var v = GRADE_VAL[d.grade];
  var label = d.c.n + " · " + d.grade + " 级";
  var old = s.learned[d.c.n];
  if(!old || GRADES.indexOf(d.grade) > GRADES.indexOf(old)){
    s.learned[d.c.n] = d.grade;
    s[d.c.cat] = clamp(s[d.c.cat] + v, 0, 100);
    return d.c.ic + " " + label + "（" + catName(d.c.cat) + " +" + v + "）";
  }
  s[d.c.cat] = clamp(s[d.c.cat] + Math.ceil(v/2), 0, 100);
  return d.c.ic + " " + label + "（重复，折算 +" + Math.ceil(v/2) + "）";
}
function catName(c){ return c==="art"?"才艺":(c==="face"?"颜值":"音色"); }

function doDraw(n){
  if(s.draws === 0 && n === 1){
    var fd = drawOne(true);
    s.draws++;
    var txt = applyDraw(fd);
    pushStory("sys", "【系统】声乐教学 · C 级 已入账。\n\n使用后可开展教学领域，名师指导，直到完成 C 级课程考核结束，可随时退出。领域内时间与你所在位面不同步——教学过程中，你的时间不变。\n\n考核通过后，才艺 +3。");
    logSys("首次抽取：声乐教学 C 级");
    save(); render();
    openModal({title:"🎼 声乐教学 · C 级", sub:"系统首次抽取 · 已自动生效",
      body:"使用后可开展教学领域，名师指导，直到完成 C 级课程考核结束，可随时退出。\n领域内时间与位面不同步——教学过程中宿主位面时间不变。\n\n" + s.name + "，别浪费。这是你唯一不用靠脸就能赢的东西。",
      opts:[{t:"收下", fn:function(){}}]});
    return;
  }
  var cost = n===10 ? 2000 : 200;
  if(s.mood < cost){ toast("情绪值不够（要 " + cost + "）","b"); return; }
  s.mood -= cost;
  var results = [];
  var gotA = false;
  for(var i=0;i<n;i++){
    var boost = (n===10 && i === n-1 && !gotA);
    var d = drawOne(false, boost);
    if(d.kind === "course" && (d.grade === "A" || d.grade === "S")) gotA = true;
    results.push(applyDraw(d));
    s.draws++;
  }
  pushStory("sys", "【系统】抽取 ×" + n + "：\n" + results.map(function(x,i){ return "　" + (i+1) + ". " + x; }).join("\n"));
  save(); render();
  openModal({title:"🎴 抽取 ×" + n, sub:"消耗 " + cost + " 情绪值",
    body: results.map(function(x,i){ return (i+1) + ". " + x; }).join("\n"),
    opts:[{t:"收下", fn:function(){}}]});
}
function logSys(m){
  pushRecent("【系统】" + m);
}

function useItem(name){
  if(!(s.items[name] > 0)) return;
  if(name === "返现暴击卡"){ s.flags.crit = 5; toast("返现暴击卡已生效","g"); }
  else if(name === "伪装滤镜"){ s.dis = clamp(s.dis+10,0,100); toast("伪装度 +10","ok"); }
  else if(name === "热搜卡"){ var g = Math.floor(s.pop*0.6)+5000; s.pop += g; toast("热搜！+"+nf(g)+" 粉","g"); }
  else if(name === "流量包"){ var g2 = Math.floor(s.pop*0.25)+1200; s.pop += g2; toast("推流 +"+nf(g2)+" 粉","g"); }
  else if(name === "清醒剂"){ s.mood += 150; toast("情绪值 +150","ok"); }
  else { toast("这个先留着。",""); return; }
  s.items[name]--;
  save(); render();
}

function streamAI(body, onDelta){
  var ep = aiEndpoint();
  if(!ep) return Promise.reject(new Error("AI off"));
  var ctl = new AbortController();
  var tm = setTimeout(function(){ ctl.abort(); }, 60000);
  return fetch(ep, {
    method:"POST", signal: ctl.signal,
    headers: {"Content-Type":"application/json","Authorization":"Bearer "+SBKEY,"apikey":SBKEY},
    body: JSON.stringify(body)
  }).then(function(r){
    if(!r.ok || !r.body) throw new Error("HTTP " + r.status);
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = "", out = "";
    function pump(){
      return reader.read().then(function(res){
        if(res.done){ clearTimeout(tm); return out; }
        buf += dec.decode(res.value, {stream:true});
        var lines = buf.split("\n");
        buf = lines.pop();
        for(var i=0;i<lines.length;i++){
          var t = lines[i].trim();
          if(t.indexOf("data:") !== 0) continue;
          var d = t.slice(5).trim();
          if(!d || d === "[DONE]") continue;
          try{
            var j = JSON.parse(d);
            var c = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
            if(c){ out += c; if(onDelta) onDelta(out); }
          }catch(e){}
        }
        return pump();
      });
    }
    return pump();
  }).then(function(v){ clearTimeout(tm); return v; }, function(e){ clearTimeout(tm); throw e; });
}

var DELTA_MAP = {"人气":"pop","财富值":"wealth","情绪值":"mood","现金":"cash","颜值":"face","才艺":"art","音色":"voice","声望":"fame","天数":"day"};
function applyDelta(str){
  var changes = [];
  String(str).split(/[,，;；]/).forEach(function(seg){
    var m = seg.match(/([^\d\+\-]+?)\s*([\+\-])?\s*(\d+)/);
    if(!m) return;
    var key = m[1].replace(/[【】\s:：]/g,"");
    var val = parseInt(m[3],10) * (m[2] === "-" ? -1 : 1);
    var f = DELTA_MAP[key];
    if(!f || !val) return;
    s[f] += val;
    changes.push(key + (val>0?" +":" ") + val);
  });
  if(changes.length){
    s.mood = Math.max(0, s.mood);
    s.cash = Math.max(0, s.cash);
    s.wealth = Math.max(0, s.wealth);
    s.pop = Math.max(0, s.pop);
    s.face = clamp(s.face,0,100); s.art = clamp(s.art,0,100);
    s.voice = clamp(s.voice,0,100); s.fame = clamp(s.fame,0,100);
    var d = DELTA_MAP;
    if(changes.join(" ").indexOf("天数") >= 0){
      var tipIn = s.tipDaily;
      s.tip += tipIn;
      changes.push("打赏金 +" + nf(tipIn));
    }
    pushStory("dlt", "◈ " + changes.join("　"));
  }
  // 阶段
  while(s.stage < STAGES.length-1 && s.pop >= STAGES[s.stage+1].pop){
    if(s.stage === 2 && s.face < 60) break;
    s.stage++;
    pushStory("sys", "【系统】阶段晋级：你现在是「" + stage().n + "」主播了。");
  }
  if(s.stage === 2 && s.pop >= STAGES[3].pop && s.face >= 60){
    pushStory("sys", "【系统】露脸条件已满足。写一句「开摄像头」试试。");
  }
  s.fame = clamp(s.fame,0,100);
  s.stage = clamp(s.stage,0,STAGES.length-1);
}

function parseAI(raw){
  var out = {nar:[], dm:[], grp:[], sys:[], guild:null};
  var lines = String(raw||"").split("\n");
  for(var i=0;i<lines.length;i++){
    var L = lines[i].replace(/\s+$/,"");
    var T = L.trim();
    if(!T) continue;
    if(T.indexOf("【变更】") === 0){ out.delta = T.slice(4); continue; }
    if(T.indexOf("【公会】") === 0){ out.guild = T.slice(4).trim(); continue; }
    if(T.indexOf("【系统】") === 0){ out.sys.push(T.slice(4).trim()); continue; }
    var d = T.match(/^【私信[·・|]([^】]+)】\s*(.*)$/);
    if(d){ out.dm.push({name:d[1].trim(), text:d[2].trim()}); continue; }
    var g = T.match(/^【群[·・|]([^·・|】]+)[·・|]([^】]+)】\s*(.*)$/);
    if(g){ out.grp.push({group:g[1].trim(), who:g[2].trim(), text:g[3].trim()}); continue; }
    out.nar.push(L);
  }
  return out;
}

function deliver(parsed, opts){
  opts = opts || {};
  var text = parsed.nar.join("\n").trim();
  if(text) pushStory("nar", text);
  parsed.sys.forEach(function(x){ pushStory("sys", "【系统】" + x); });

  var touched = {};
  parsed.dm.forEach(function(m){
    if(!m.name) return;
    var th = ensureThread(m.name, "dm");
    addMsg(th, m.name, m.text);
    touched[th.id] = true;
    if(m.name !== "神豪" && !s.targets[m.name]){
      s.targets[m.name] = {aff: ri(2,8), bound:false, file:""};
    } else if(s.targets[m.name]){
      s.targets[m.name].aff = clamp(s.targets[m.name].aff + 1, 0, 100);
    }
  });
  parsed.grp.forEach(function(g){
    if(!g.group) return;
    var th = ensureThread(g.group, "group");
    addMsg(th, g.who || "某人", g.text);
    touched[th.id] = true;
  });

  Object.keys(touched).forEach(function(id){
    var th = s.threads[id];
    var isOpen = (page === "dm" && openThread === id);
    if(isOpen){ th.unread = 0; }
    else {
      th.unread = (th.unread||0) + 1;
      pushStory("hint", "💬 " + (th.type==="group" ? "群「"+th.name+"」" : th.name) + " 给你发了消息", id);
    }
  });

  if(parsed.guild){
    var gname = GUILDS.filter(function(g){ return parsed.guild.indexOf(g) >= 0; })[0];
    if(gname && s.guild !== gname){
      s.guild = gname;
      pushStory("sys", "【系统】已加入公会：**" + gname + "**\n" + GUILD_DESC[gname]);
      toast("加入 " + gname, "g");
    }
  }

  if(parsed.delta) applyDelta(parsed.delta);
  else if(!Object.keys(touched).length) {
    // 没有结算行也允许，避免卡死
  }

  pushRecent("【" + s.name + "】" + (opts.echo || ""));
  var summary = [];
  if(text) summary.push(text.slice(0, 260));
  parsed.dm.slice(0,4).forEach(function(m){ summary.push(m.name + "：" + m.text); });
  parsed.sys.slice(0,2).forEach(function(x){ summary.push("系统：" + x); });
  if(summary.length) pushRecent(summary.join(" / "));

  save(); render();
}

function localEngine(text){
  var t = text || "";
  var out = "";
  var delta = {人气:0, 财富值:0, 情绪值:0, 现金:0, 颜值:0, 才艺:0, 音色:0, 声望:0, 天数:0};
  if(/刷|打赏金|给自己/.test(t)){
    var amt = Math.min(s.tip, s.tip > 0 ? pick([10000, 50000, s.tip]) : 0);
    if(amt >= 10000){
      s.tip -= amt;
      var gain = Math.floor(Math.pow(amt/60, 0.85) * clamp(0.9 + s.face/220 + s.voice/220, 0.9, 2.4));
      var back = amt * (s.flags.crit || 1); s.flags.crit = 0;
      delta.人气 += gain; delta.现金 += back; delta.财富值 += back;
      out = "你把打赏金导进礼物系统，用自己的号，一笔一笔刷在自己身上。\n\n礼物条一路顶上去，榜一那栏是你的小号。弹幕炸了，「主播自己刷自己？」「有钱真好」。\n\n你看着人数往上跳，没解释，也不打算解释。";
    } else {
      out = "打赏金不够。再攒攒。";
    }
  } else if(/开播|直播|唱|说话|连麦|pk|PK/.test(t)){
    var base = Math.max(s.face*0.6 + s.art*0.7 + s.voice*0.5, 6);
    var gain2 = Math.floor(base * (s.stage+1) * rnd(6,16));
    var cash2 = Math.floor(rnd(60,260) * (s.stage+1));
    delta.人气 += gain2; delta.现金 += cash2; delta.财富值 += cash2; delta.情绪值 += ri(10,40);
    out = "你按下开播。\n\n前三十秒是冷的，只有几个老粉在刷「来了」。第三分钟，有人把你的一段转成了切片。\n\n人数开始往上跳。" +
      (/唱/.test(t) ? "你清唱了一段，没有伴奏，气息压在最后一句上——弹幕停了两秒，然后刷了一屏。" : "") +
      "\n\n下播的时候，你看了眼数据，比你预想的好。";
    if(Math.random() < 0.4){
      var nm = pick(["早睡的老公粉","路过的听众","隔壁厅的同行"]);
      out += "\n\n【私信·" + nm + "】刚那一段能再发我一遍吗，我没听够。";
    }
  } else if(/休息|睡|过夜|第.*天/.test(t)){
    var tipIn = s.tipDaily; s.tip += tipIn;
    delta.天数 += 1; delta.情绪值 += 10;
    out = "你关灯，躺下。手机屏幕最后亮了一下——系统提示打赏金已到账：" + nf(tipIn) + " 元。\n\n明天还得继续。";
  } else {
    delta.人气 += ri(5, 60); delta.情绪值 += ri(5, 20);
    out = "你做了这件事。\n\n世界安静地给出了它的反应——不算好，也不算坏。但数据比昨天动了一点。";
  }
  out += "\n\n【变更】" + Object.keys(delta).map(function(k){ return k + (delta[k]>0?"+":"") + delta[k]; }).join(", ");
  return out;
}

function stars(){
  var c = document.getElementById("stars"), x = c.getContext("2d");
  function size(){ c.width = innerWidth; c.height = innerHeight; }
  size(); addEventListener("resize", size);
  var pts = [];
  for(var i=0;i<60;i++) pts.push({x:Math.random(), y:Math.random(), r:Math.random()*1.4+0.3, s:Math.random()*0.3+0.05, p:Math.random()*6.28});
  function tick(t){
    x.clearRect(0,0,c.width,c.height);
    for(var i=0;i<pts.length;i++){
      var p = pts[i];
      var a = 0.26 + Math.sin(t/1400 + p.p)*0.24;
      x.beginPath(); x.arc(p.x*c.width, p.y*c.height, p.r, 0, 6.283);
      x.fillStyle = "rgba(220,205,255," + Math.max(0.05,a) + ")"; x.fill();
      p.y -= p.s/1000;
      if(p.y < -0.02){ p.y = 1.02; p.x = Math.random(); }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

  document.getElementById("backBtn").onclick = function(){ openThread = null; showList(); render(); };
  document.getElementById("a-export").onclick = exportSave;
  document.getElementById("a-import").onclick = importSave;
  document.getElementById("a-rename").onclick = rename;
  document.getElementById("a-reset").onclick = reset;
  document.getElementById("a-aiMode").onclick = aiModeCycle;
  document.getElementById("a-aiTest").onclick = aiTest;

  document.getElementById("story").addEventListener("click", function(e){
    var el = e.target.closest ? e.target.closest("[data-open]") : null;
    if(!el) return;
    var id = el.getAttribute("data-open");
    if(id && s.threads[id]){
      openThread = id; s.threads[id].unread = 0;
      go("dm"); render();
    }
  });
  document.getElementById("dmList").addEventListener("click", function(e){
    var el = e.target.closest ? e.target.closest("[data-thread]") : null;
    if(!el) return;
    var id = el.getAttribute("data-thread");
    if(s.threads[id]){ openThread = id; s.threads[id].unread = 0; render(); }
  });
  document.getElementById("tgts").addEventListener("click", function(e){
    var t = e.target;
    if(!t || t.tagName !== "BUTTON") return;
    var a = t.getAttribute("data-probe"), b = t.getAttribute("data-bind"), c = t.getAttribute("data-dream");
    if(a) doProbe(a);
    if(b) doBind(b);
    if(c) doDream(c);
  });
  document.getElementById("bag").addEventListener("click", function(e){
    var t = e.target;
    if(!t || t.tagName !== "BUTTON") return;
    var u = t.getAttribute("data-use");
    if(u) useItem(u);
  });
  document.getElementById("modal").addEventListener("click", function(e){ if(e.target === this) closeModal(); });
  document.addEventListener("visibilitychange", function(){ if(document.hidden) save(); });
  addEventListener("beforeunload", save);
}

stars();
bind();
var existing = load();
if(existing){
  s = existing;
  if(!s.story.length) startStory(false);
  render(); go("story");
} else {
  s = newState("星晚");
  intro();
}
setInterval(function(){ if(s) save(); }, 20000);

})();
</script>
</body>
</html>
