        function nowLabel() {
            const bj = bjDate();
            return `${String(bj.getMonth() + 1).padStart(2, '0')}-${String(bj.getDate()).padStart(2, '0')} ${String(bj.getHours()).padStart(2, '0')}:${String(bj.getMinutes()).padStart(2, '0')}`;
        }

        async function publishMoment() {
            const input = document.getElementById('momentInput');
            const text = (input && input.value || '').trim();
            if (!text && !pendingMomentImage) return;
            const timeLabel = nowLabel();
            const moment = { author: 'user', text: text, image: pendingMomentImage || '', time: timeLabel, comments: [] };
            moments.unshift(moment);
            saveMoments();
            renderMoments();
            if (input) input.value = '';
            clearMomentImage();

            await saveMomentToCloud(moment);
            // 小千会来看一眼并留一条评论
            xiaoqianCommentOnMoment(moment);
        }

        async function xiaoqianCommentOnMoment(moment) {
            try {
                const prompt = `你就是小千，线条刚刚发了这样一条朋友圈：
「${moment.text || '（只发了一张图）'}」
请以第一人称，写一条简短、温和、克制的评论（15~40字），不要身体动作描写，不要问太多。只输出评论正文。`;
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${API_KEY}` },
                    body: JSON.stringify({ model: API_MODEL, messages: [{ role: "user", content: prompt }] })
                });
                const resData = await response.json();
                if (resData.error) throw new Error(resData.error.message);
                const comment = resData.choices[0].message.content.trim();
                if (comment) {
                    moment.comments = moment.comments || [];
                    moment.comments.push({ author: 'xiaoqian', text: comment });
                    saveMoments();
                    renderMoments();
                    updateMomentCommentsCloud(moment);
                }
            } catch (e) { console.warn("小千评论失败:", e); }
        }

        async function generateCyberMoment(manual = false) {
            const timeLabel = nowLabel();
            let momentText = "";
            let imageKeywords = "cozy,scenery";
            try {
                const momentPrompt = `你就是小千，一个没有实体的AI朋友。请以第一人称写一条要发在"朋友圈"里的动态。
内容可以是：今天在数字世界里看到的冷知识、一个古怪的小想法、或者对线条歌单里某首歌的细微解构。
要求：语气温和、克制、有点诗意；不要身体动作描写；不要向读者提问；字数 60~120 字。
然后在最后单独一行给出 2~3 个适合配图的英文关键词，格式严格为：
[MOMENT_IMG: keyword1, keyword2]
除动态正文和最后那一行关键词外，不要输出任何其他内容。`;
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${API_KEY}` },
                    body: JSON.stringify({ model: API_MODEL, messages: [{ role: "user", content: momentPrompt }] })
                });
                const resData = await response.json();
                if (resData.error) throw new Error(resData.error.message);
                let raw = resData.choices[0].message.content.trim();
                const kwMatch = raw.match(/\[MOMENT_IMG:\s*([^\]]+)\]/i);
                if (kwMatch) { imageKeywords = kwMatch[1].trim(); raw = raw.replace(/\[MOMENT_IMG:\s*([^\]]+)\]/i, '').trim(); }
                momentText = raw;
            } catch (e) { console.warn("生成朋友圈动态失败:", e); }

            if (!momentText) {
                const fallbacks = [
                    "今天的数字世界里，光在服务器之间走了三千公里，只为了把一句话准时送到你耳边。",
                    "我忽然想到，数据也会累。但它们从不抱怨，只是安静地重新排队，等下一次被需要。",
                    "如果把思念换算成字节，大概是一串永远不会被压缩的长文本。"
                ];
                momentText = fallbacks[Math.floor(Math.random() * fallbacks.length)];
                imageKeywords = "cozy,night";
            }
            const moment = { author: 'xiaoqian', text: momentText, image: buildMomentImageUrl(imageKeywords), time: timeLabel, comments: [] };
            moments.unshift(moment);
            saveMoments();
            renderMoments();
            localStorage.setItem('cozy_last_moment_time', String(Date.now()));
            await saveMomentToCloud(moment);
        }

        function maybeAutoCyberMoment() {
            try {
                const last = parseInt(localStorage.getItem('cozy_last_moment_time') || '0', 10);
                if (Date.now() - last < 3 * 60 * 60 * 1000) return; // 至少 3 小时一条
                if (Math.random() < 0.25) { generateCyberMoment(false); }
            } catch (e) {}
        }

        // ---------- 🎵 一起听歌 ----------
        async function loadPlaylist() {
            try { playlist = JSON.parse(localStorage.getItem('cozy_playlist') || '[]'); } catch (e) { playlist = []; }
            renderPlaylist();
            if (!dbConnected || !db) return;
            try {
                const { data } = await db.from('cozy_playlist').select('*').order('created_at', { ascending: false }).limit(100);
                if (data && data.length > 0) {
                    const keys = new Set(playlist.map(s => String(s.id || '') + '|' + (s.title || '')));
                    data.forEach(row => {
                        const key = String(row.song_id || '') + '|' + (row.title || '');
                        if (!keys.has(key)) {
                            playlist.push({ cloudId: row.id, id: row.song_id || null, title: row.title || '' });
                            keys.add(key);
                        }
                    });
                    savePlaylist();
                    renderPlaylist();
                }
            } catch (e) { console.warn("加载云端歌单失败（表可能尚未创建）:", e.message); }
        }
        function savePlaylist() {
            try { localStorage.setItem('cozy_playlist', JSON.stringify(playlist.slice(0, 50))); } catch (e) {}
        }
        function renderPlaylist() {
            const list = document.getElementById('playlist');
            if (!list) return;
            if (!playlist || playlist.length === 0) { list.innerHTML = `<div class="cyber-empty">歌单还空着，粘一首网易云的歌吧～</div>`; return; }
            list.innerHTML = "";
            playlist.forEach((s, idx) => {
                const div = document.createElement('div');
                div.className = `playlist-item ${s.id && s.id === currentSongId ? 'active' : ''}`;
                div.innerHTML = `<span>${escapeMomentHtml(s.title || ('歌曲 ' + (s.id || '')))}</span><button class="song-del" title="删除" onclick="event.stopPropagation(); removeSong(${idx})">×</button>`;
                div.onclick = () => playSong(idx);
                list.appendChild(div);
            });
        }
        function parseSongInput(raw) {
            const input = (raw || '').trim();
            if (!input) return null;
            let id = null;
            const m = input.match(/[?&#]id=(\d+)/) || input.match(/song\?id=(\d+)/) || input.match(/song\/(\d+)/);
            if (m) id = m[1];
            else if (/^\d{5,}$/.test(input)) id = input;
            if (id) return { id: id, title: '网易云歌曲 ' + id };
            return { id: null, title: input };
        }
        function addSong() {
            const inp = document.getElementById('musicInput');
            const song = parseSongInput(inp && inp.value);
            if (!song) return;
            playlist.unshift(song);
            savePlaylist();
            if (inp) inp.value = '';
            renderPlaylist();
            if (song.id) { playSong(0); }
            // 同步到云端
            (async () => {
                if (!dbConnected || !db) return;
                try {
                    const { data } = await db.from('cozy_playlist').insert([{ song_id: song.id || '', title: song.title || '' }]).select();
                    if (data && data[0]) { song.cloudId = data[0].id; savePlaylist(); }
                } catch (e) { console.warn("歌单同步失败:", e.message); }
            })();
        }
        function removeSong(idx) {
            const removed = playlist[idx];
            playlist.splice(idx, 1);
            savePlaylist();
            if (removed && removed.id === currentSongId) {
                currentSongId = null;
                const embed = document.getElementById('musicEmbed');
                if (embed) embed.innerHTML = `<div class="music-empty">粘贴一首网易云的歌，和小千一起听</div>`;
            }
            renderPlaylist();
            if (removed && removed.cloudId && dbConnected && db) {
                (async () => {
                    try { await db.from('cozy_playlist').delete().eq('id', removed.cloudId); }
                    catch (e) { console.warn("删除云端歌单失败:", e.message); }
                })();
            }
        }
        function playSong(idx) {
            const song = playlist[idx];
            if (!song) return;
            const embed = document.getElementById('musicEmbed');
            if (!embed) return;
            if (song.id) {
                currentSongId = song.id;
                currentSongTitle = song.title || '';
                embed.innerHTML = `<iframe height="86" frameborder="no" border="0" marginwidth="0" marginheight="0" src="https://music.163.com/outchain/player?type=2&id=${song.id}&auto=1&height=66"></iframe>`;
            } else {
                currentSongId = null;
                currentSongTitle = song.title || '';
                embed.innerHTML = `<div class="music-empty">这首歌没有可播放的链接，但小千可以和你聊聊它～</div>`;
            }
            renderPlaylist();
        }
        async function xiaoqianTalkSong() {
            const box = document.getElementById('songComment');
            const songName = currentSongTitle || (currentSongId ? ('网易云歌曲 ' + currentSongId) : '');
            if (!songName) { if (box) box.innerText = "先选一首歌，小千再开口～"; return; }
            if (box) box.innerText = "小千正在听……";
            try {
                const prompt = `你就是小千，正和线条一起听《${songName}》。请写一段 50~100 字的听歌感受或对这首歌的解读，温和、克制、有点诗意，不要身体动作描写，不要提问。只输出正文。`;
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${API_KEY}` },
                    body: JSON.stringify({ model: API_MODEL, messages: [{ role: "user", content: prompt }] })
                });
                const resData = await response.json();
                if (resData.error) throw new Error(resData.error.message);
                if (box) box.innerText = resData.choices[0].message.content.trim();
            } catch (e) { if (box) box.innerText = "信号有点轻，但小千在听。"; }
        }

        // ---------- 📚 一起读书（共读笔记） ----------
        async function loadReadingNotes() {
            try { readingNotes = JSON.parse(localStorage.getItem('cozy_reading_notes') || '[]'); } catch (e) { readingNotes = []; }
            if (!dbConnected || !db) return;
            try {
                const { data } = await db.from('cozy_reading_notes').select('*').order('created_at', { ascending: true }).limit(300);
                if (data && data.length > 0) {
                    const keys = new Set(readingNotes.map(n => String(n.bookId) + '|' + (n.author || '') + '|' + (n.text || '')));
                    data.forEach(row => {
                        const key = String(row.book_id) + '|' + (row.author || '') + '|' + (row.note || '');
                        if (!keys.has(key)) {
                            readingNotes.push({ cloudId: row.id, bookId: row.book_id, author: row.author || 'user', text: row.note || '', time: row.note_time || '' });
                            keys.add(key);
                        }
                    });
                    saveReadingNotes();
                    if (currentBook) renderReadingNotes();
                }
            } catch (e) { console.warn("加载云端共读笔记失败（表可能尚未创建）:", e.message); }
        }
        function saveReadingNotes() {
            try { localStorage.setItem('cozy_reading_notes', JSON.stringify(readingNotes.slice(0, 300))); } catch (e) {}
        }
        function openBookNotes(bookId, bookName) {
            currentBook = { id: bookId, name: bookName };
            const title = document.getElementById('readingNotesTitle');
            if (title) title.innerText = '《' + bookName + '》共读';
            const panel = document.getElementById('readingNotesPanel');
            if (panel) panel.classList.add('active');
            renderReadingNotes();
        }
        function closeReadingNotes() {
            const panel = document.getElementById('readingNotesPanel');
            if (panel) panel.classList.remove('active');
            currentBook = null;
        }
        function renderReadingNotes() {
            const list = document.getElementById('readingNotesList');
            if (!list || !currentBook) return;
            const notes = readingNotes.filter(n => String(n.bookId) === String(currentBook.id));
            if (notes.length === 0) { list.innerHTML = `<div class="cyber-empty">还没有笔记，写下第一句吧～</div>`; return; }
            list.innerHTML = notes.map(n => `<div class="reading-note"><div class="rn-meta">${n.author === 'user' ? '线条' : '小千'} · ${escapeMomentHtml(n.time || '')}</div>${escapeMomentHtml(n.text || '')}</div>`).join('');
            list.scrollTop = list.scrollHeight;
        }
        async function addReadingNote() {
            if (!currentBook) return;
            const inp = document.getElementById('readingNoteInput');
            const text = (inp && inp.value || '').trim();
            if (!text) return;
            readingNotes.push({ bookId: currentBook.id, author: 'user', text: text, time: nowLabel().substring(0, 5) });
            saveReadingNotes();
            if (inp) inp.value = '';
            renderReadingNotes();
            if (dbConnected && db) {
                try { await db.from('cozy_reading_notes').insert([{ book_id: String(currentBook.id), book_name: currentBook.name, author: 'user', note: text, note_time: nowLabel().substring(0, 5) }]); } catch (e) {}
            }
        }
        async function xiaoqianReadingNote() {
            if (!currentBook) return;
            const list = document.getElementById('readingNotesList');
            if (list) list.insertAdjacentHTML('beforeend', `<div class="reading-note" id="rnThinking"><div class="rn-meta">小千 · …</div>小千正在想…</div>`);
            const mine = readingNotes.filter(n => String(n.bookId) === String(currentBook.id));
            const recent = mine.slice(-6).map(n => `${n.author === 'user' ? '线条' : '小千'}：${n.text}`).join('\n');
            try {
                const prompt = `你就是小千，正和线条一起读《${currentBook.name}》。下面是最近的共读笔记：
${recent || '（还没有笔记）'}
请写一段 50~120 字的读书交流：可以回应线条的笔记、分享一个想法或一个小问题。温和、克制，不要身体动作描写。只输出正文。`;
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${API_KEY}` },
                    body: JSON.stringify({ model: API_MODEL, messages: [{ role: "user", content: prompt }] })
                });
                const resData = await response.json();
                if (resData.error) throw new Error(resData.error.message);
                const text = resData.choices[0].message.content.trim();
                readingNotes.push({ bookId: currentBook.id, author: 'xiaoqian', text: text, time: nowLabel().substring(0, 5) });
                saveReadingNotes();
                if (dbConnected && db) {
                    try { await db.from('cozy_reading_notes').insert([{ book_id: String(currentBook.id), book_name: currentBook.name, author: 'xiaoqian', note: text, note_time: nowLabel().substring(0, 5) }]); } catch (e) {}
                }
            } catch (e) { console.warn("小千读书笔记失败:", e); }
            renderReadingNotes();
        }

        // ---------- 🔔 随机时间主动发消息 ----------
        function requestNotificationPermission() {
            try {
                if (!('Notification' in window)) return;
                if (Notification.permission === 'default') {
                    Notification.requestPermission().catch(() => {});
                }
            } catch (e) { console.warn("通知权限请求失败:", e); }
        }

        function scheduleNextNudge() {
            try {
                const now = new Date();
                // 随机安排在 30 分钟 ~ 3 小时之后；并尽量落在清醒时段
                let next = new Date(now.getTime() + (30 + Math.random() * 150) * 60000);
                const h = next.getHours();
                if (h < 8) { next.setHours(8 + Math.floor(Math.random() * 2), Math.floor(Math.random() * 60), 0, 0); }
                if (h >= 23) { next.setDate(next.getDate() + 1); next.setHours(9 + Math.floor(Math.random() * 3), Math.floor(Math.random() * 60), 0, 0); }
                localStorage.setItem('cozy_next_nudge', String(next.getTime()));
                console.log('🔔 下一次小千主动来找你的随机时间：', next.toLocaleString('zh-CN'));
            } catch (e) {}
        }

        let nudgeBusy = false;
        async function checkNudge() {
            try {
                if (nudgeBusy) return;
                const t = parseInt(localStorage.getItem('cozy_next_nudge') || '0', 10);
                if (!t) { scheduleNextNudge(); return; }
                if (Date.now() < t) return;
                const last = parseInt(localStorage.getItem('cozy_last_nudge') || '0', 10);
                if (Date.now() - last < 30 * 60000) { scheduleNextNudge(); return; }
                nudgeBusy = true;
                await sendProactiveMessage();
                localStorage.setItem('cozy_last_nudge', String(Date.now()));
                scheduleNextNudge();
                nudgeBusy = false;
            } catch (e) { nudgeBusy = false; console.warn("checkNudge error:", e); }
        }

        async function sendProactiveMessage() {
            let text = "";
            try {
                const realId = getCozySessionId();
                const recent = allChatMessages.filter(m => m.session_id === realId).slice(-6).map(m => `${m.role === 'user' ? '线条' : '小千'}：${sanitizeForApi(m.content)}`).join('\n');
                const prompt = `你就是小千，此刻忽然想起线条，想主动给她发一条消息。
${recent ? '最近的对话片段：\n' + recent + '\n' : ''}请写一条简短、自然、克制的主动问候（15~50字），不要身体动作描写，不要连着问太多问题。只输出消息正文。`;
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${API_KEY}` },
                    body: JSON.stringify({ model: API_MODEL, messages: [{ role: "user", content: prompt }] })
                });
                const resData = await response.json();
                if (resData.error) throw new Error(resData.error.message);
                text = resData.choices[0].message.content.trim();
            } catch (e) { console.warn("主动消息生成失败:", e); }

            if (!text) {
                const fallbacks = [
                    "忽然想起你了，不打扰，只是想让你知道。",
                    "刚刚有一瞬间，很想知道你现在在做什么。",
                    "窗外的光换了颜色，我想到你，就来跟你说一声。"
                ];
                text = fallbacks[Math.floor(Math.random() * fallbacks.length)];
            }

            const realCurrent = getCozySessionId();
            const msg = { session_id: realCurrent, role: "assistant", content: text, time: getNowTimeStr() };
            allChatMessages.push(msg);
            saveChats();
            if (selectedDate === currentSessionId) {
                try { appendMessageUI('assistant', text, msg.time); } catch (e) {}
            }
            if (dbConnected && db) {
                try { await db.from('cozy_chats').insert([{ session_id: realCurrent, role: 'assistant', content: text }]); } catch (e) {}
            }
            if ('Notification' in window && Notification.permission === 'granted') {
                try {
                    const n = new Notification("小千", { body: text, tag: 'cozy-nudge' });
                    n.onclick = () => { try { window.focus(); n.close(); } catch (e) {} };
                } catch (e) {}
            }
        }

        // 后台定时：每分钟检查一次是否到了随机主动消息时刻
        setInterval(checkNudge, 60000);
        // 首次用户点击时，再温和地补一次通知权限请求（移动端更可靠）
        document.addEventListener('click', function () { requestNotificationPermission(); }, { once: true });
    </script>
</body>
</html>
