        // ================= 【时间戳与头像辅助】 =================
        function bjDate(dateObj = new Date()) {
            const d = new Date(dateObj);
            const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
            return new Date(utc + (3600000 * 8));
        }
        function getNowTimeStr() {
            const bj = bjDate();
            return `${String(bj.getHours()).padStart(2, '0')}:${String(bj.getMinutes()).padStart(2, '0')}`;
        }
        function formatTimeFromISO(iso) {
            if (!iso) return "";
            const d = new Date(iso);
            if (isNaN(d.getTime())) return "";
            const bj = bjDate(d);
            return `${String(bj.getHours()).padStart(2, '0')}:${String(bj.getMinutes()).padStart(2, '0')}`;
        }

        // 清洗图片关键词：去掉空格（loremflickr 遇到 %20 会返回 403，导致图片/头像变空白）
        function flickrKeywords(kw, fallback) {
            const s = String(kw == null ? '' : kw)
                .split(',')
                .map(x => x.trim().replace(/\s+/g, ''))
                .filter(Boolean)
                .join(',');
            return s || (fallback || 'cozy,scenery');
        }

        // 头像内层 HTML：外链头像加载失败时优雅退回文字，避免出现空白圆圈
        function avatarInnerHtml(url, label) {
            if (!url) return label;
            return `<img src="${url}" alt="${label}" referrerpolicy="no-referrer" loading="lazy" onerror="(function(el){var d=el.parentNode;if(d){d.textContent='${label}';}})(this)">`;
        }

        // 把一张图裁成正方形头像（居中裁切），返回 Promise<dataURL>
        function makeSquareAvatar(dataUrl, size) {
            size = size || 240;
            return new Promise((resolve) => {
                try {
                    const img = new Image();
                    img.onload = function () {
                        try {
                            const min = Math.min(img.width, img.height);
                            const sx = (img.width - min) / 2, sy = (img.height - min) / 2;
                            const canvas = document.createElement('canvas');
                            canvas.width = size; canvas.height = size;
                            canvas.getContext('2d').drawImage(img, sx, sy, min, min, 0, 0, size, size);
                            resolve(canvas.toDataURL('image/jpeg', 0.9));
                        } catch (e) { resolve(dataUrl); }
                    };
                    img.onerror = function () { resolve(dataUrl); };
                    img.src = dataUrl;
                } catch (e) { resolve(dataUrl); }
            });
        }

        function getAvatarHtml(role) {
            const isUser = role === 'user';
            const url = isUser ? avatarUser : avatarXiaoqian;
            const cls = isUser ? 'chat-avatar avatar-user' : 'chat-avatar avatar-xiaoqian';
            const title = isUser ? '点击上传/更换你的头像' : '点击让小千换一个新头像';
            const onclick = isUser ? 'changeUserAvatar()' : 'changeXiaoqianAvatar()';
            const label = isUser ? '线' : '千';

        // 生成带多图源兜底的 <img> 标签 — 使用内容哈希作为固定 seed，避免每次刷新换图
        function stableSeed(text) {
            let h = 0;
            for (let i = 0; i < Math.min(text.length, 100); i++) { h = ((h << 5) - h + text.charCodeAt(i)) | 0; }
            return Math.abs(h);
        }
        function imageTagHtml(primary, altText, className) {
            const seed = stableSeed(primary + (altText || ''));
            const fb2 = `https://picsum.photos/seed/${seed}/400/300`;
            const fb3 = `https://t.alcy.cc/pc?${seed}`;
            const fallbackList = [fb2, fb3].join('|');
            const cls = className ? ` class="${className}"` : '';
            const alt = String(altText || '图片').replace(/"/g, '&quot;');
            return `<img${cls} src="${primary}" alt="${alt}" loading="lazy" data-fb="${fallbackList}" data-fbi="0" onerror="(function(el){var l=(el.getAttribute('data-fb')||'').split('|');var i=parseInt(el.getAttribute('data-fbi')||'0',10);if(i<l.length){el.setAttribute('data-fbi',i+1);el.src=l[i];}else{el.onerror=null;}})(this)" onclick="window.open(this.src)">`;
        }

        // 发送给模型前，清洗掉超长的图片 base64 与内部指令，避免请求过大、也避免模型困惑
        function sanitizeForApi(content) {
            let s = String(content == null ? '' : content);
            s = s.replace(/\[LinesImage:\s*[\s\S]+?\]/g, '[线条发来了一张图片]');
            s = s.replace(/\[SET_AVATAR:\s*[^\]]+\]/gi, '');
            s = s.replace(/\[SHOW_IMAGE:\s*[^\]]+\]/gi, '');
            s = s.replace(/\[MOMENT_IMG:\s*[^\]]+\]/gi, '');
            s = s.replace(/\[VOICE\]/gi, '');
            return s.trim();
        }

        // 把一条消息正文转换成可渲染的 HTML（含图片指令处理）
        function messageContentToHtml(rawContent) {
            const content = String(rawContent == null ? '' : rawContent);
            const imageRegex = /\[LinesImage:\s*([\s\S]+?)\]/;
            const imageMatch = content.match(imageRegex);
            if (imageMatch) {
                const base64Data = imageMatch[1].trim();
                const cleanText = content.replace(imageRegex, '').trim();
                let textHtml = '';
                try { textHtml = cleanText ? marked.parse(cleanText) : ''; }
                catch (e) { textHtml = cleanText ? cleanText.replace(/\n/g, '<br>') : ''; }
                return `<div style="margin: 5px 0;"><img src="${base64Data}" style="max-width:100%;max-height:220px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);cursor:pointer;" onclick="window.open('${base64Data}')"></div>${textHtml}`;
            }
            const withShowImages = content.replace(/\[SHOW_IMAGE:\s*([^\]]+)\]/gi, (m, kw) => {
                const url = `https://loremflickr.com/400/300/${flickrKeywords(kw)}`;
                return `\n\n<div class="show-image-card">${imageTagHtml(url, kw.trim())}</div>\n\n`;
            });
            try { return marked.parse(withShowImages); }
            catch (e) { return withShowImages.replace(/\n/g, '<br>'); }
        }

        // 处理小千回复里的特殊指令（主动换头像等），返回清理后的正文
        function applyReplyTokens(text) {
            let out = String(text == null ? '' : text);
            const m = out.match(/\[SET_AVATAR:\s*([^\]]+)\]/i);

            const input = document.createElement('input');
            input.type = 'file';

            input.onchange = function (e) {
                const file = e.target.files && e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function (ev) {
                    const img = new Image();
                    img.onload = function () {
                        const size = 160;
                        const canvas = document.createElement('canvas');
                        canvas.width = size; canvas.height = size;
                        const ctx = canvas.getContext('2d');
                        const min = Math.min(img.width, img.height);
                        const sx = (img.width - min) / 2, sy = (img.height - min) / 2;
                        ctx.drawImage(img, sx, sy, min, min, 0, 0, size, size);
                        avatarUser = canvas.toDataURL('image/jpeg', 0.85);
                        try { localStorage.setItem('cozy_avatar_user', avatarUser); } catch (e) {}
                        saveAvatarsToCloud();
                        refreshAvatarsInDom();
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        function searchChatHistory() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const panel = document.getElementById('searchResultsOverlay');
            const listContainer = document.getElementById('searchResultsList');
            const countLabel = document.getElementById('searchResultCount');
            
            if (!query) {
                alert("请输入想要查找的内容哦～");
                return;
            }

            listContainer.innerHTML = "";
            panel.classList.add('active');

            // 搜索所有本地合并后（含云端）的完整聊天记录
            const results = allChatMessages.filter(msg => {
                const contentStr = String(msg.content || '').toLowerCase();
                // 排除自动生成的系统图片描述和欢迎语，只搜索实质性对话
                return contentStr.includes(query) && !contentStr.includes("信号稍有波动") && !contentStr.includes("由于发送时检测到跨天");
            });

            countLabel.innerText = `找到 ${results.length} 条相关对话`;

            if (results.length === 0) {
                listContainer.innerHTML = `<div style="text-align:center; opacity:0.4; font-size:12px; margin-top:40px;">没有找到包含“${query}”的聊天心事......</div>`;
                return;
            }

            // 渲染搜寻出的结果卡片列表
            results.forEach(msg => {
                const item = document.createElement('div');
                item.className = "search-item";
                
                // 格式化日期标题
                let dateLabel = msg.session_id;
                if (dateLabel === currentSessionId) { dateLabel = "今天"; }
                
                // 内容高亮处理
                const rawContent = String(msg.content);
                const queryIndex = rawContent.toLowerCase().indexOf(query);
                let highlightedContent = rawContent;
                if (queryIndex !== -1) {
                    const start = Math.max(0, queryIndex - 25);
                    const end = Math.min(rawContent.length, queryIndex + query.length + 45);
                    let snippet = rawContent.substring(start, end);
                    if (start > 0) snippet = "..." + snippet;
                    if (end < rawContent.length) snippet = snippet + "...";
                    
                    const escapedQuery = query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
                    const regex = new RegExp(`(${escapedQuery})`, 'gi');
                    highlightedContent = snippet.replace(regex, '<span class="search-highlight">$1</span>');
                }

                item.innerHTML = `
                    <div class="search-item-meta">
                        <span>💬 ${msg.role === 'user' ? '你说的' : '小千说的'}</span>
                        <span>📅 ${dateLabel}</span>
                    </div>
                    <div class="search-item-content">${highlightedContent}</div>
                `;
                
                // 点击卡片直接跳转回那一天的聊天页面
                item.onclick = () => {
                    closeSearchPanel();
                    switchDate(msg.session_id);
                    // 滚动定位到含有该内容的聊天气泡位置
                    setTimeout(() => {
                        const bubbles = document.querySelectorAll('.message-bubble');
                        for (let b of bubbles) {
                            if (b.innerText.toLowerCase().includes(query)) {
                                b.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                b.style.transition = "all 0.5s";
                                b.style.boxShadow = "0 0 15px var(--lamp-glow)";
                                setTimeout(() => b.style.boxShadow = "none", 2500);
                                break;
                            }
                        }
                    }, 200);
                };
                listContainer.appendChild(item);
            });
        }

        // ---------- 🫧 朋友圈（小千和线条都可以发） ----------
        async function loadMoments() {
            try { moments = JSON.parse(localStorage.getItem('cozy_moments') || '[]'); } catch (e) { moments = []; }
            renderMoments();
            if (!dbConnected || !db) return;
            try {
                const { data } = await db.from('cozy_moments').select('*').order('created_at', { ascending: false }).limit(100);
                if (data && data.length > 0) {
                    const keys = new Set(moments.map(m => (m.time || '') + '|' + (m.author || '') + '|' + (m.text || '')));
                    data.forEach(row => {
                        const key = (row.moment_time || '') + '|' + (row.author || 'xiaoqian') + '|' + (row.content || '');
                        if (!keys.has(key)) {
                            moments.push({ cloudId: row.id, author: row.author || 'xiaoqian', text: row.content || '', image: row.image || '', time: row.moment_time || '', comments: row.comments || [] });
                            keys.add(key);
                        }
                    });
                    moments.sort((a, b) => String(b.time).localeCompare(String(a.time)));
                    saveMoments();
                    renderMoments();
                }
            } catch (e) { console.warn("加载云端朋友圈失败（表可能尚未创建）:", e.message); }
        }
        function saveMoments() {
            try { localStorage.setItem('cozy_moments', JSON.stringify(moments.slice(0, 60))); } catch (e) {}

                    author: moment.author,
                    content: moment.text,
                    image: moment.image || '',
                    image_keywords: '',
                    comments: moment.comments || []
                }]).select();
                if (!error && data && data[0]) { moment.cloudId = data[0].id; saveMoments(); }

                let next = new Date(now.getTime() + (30 + Math.random() * 150) * 60000);

            const zh = all.filter(v => /^zh/i.test(v.lang));
            ttsVoice = zh.find(v => MALE_VOICE_RE.test(v.name))
                || zh.find(v => !FEMALE_VOICE_RE.test(v.name))
                || zh[0]
                || null;

        function setDesignPrompt(v) { try { localStorage.setItem('cozy_voice_prompt', v); } catch (e) {} }

        async function designVoiceNow() {
            const box = document.getElementById('voiceDesignPrompt');
            const status = document.getElementById('voiceDesignStatus');
            const prompt = (box && box.value || '').trim();
            if (!prompt) return;
            setDesignPrompt(prompt);
            if (status) status.textContent = '正在设计…大概十几秒，别关页面';
            try {
                const r = await fetch(EDGE_FN_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}`, 'apikey': SUPABASE_KEY },
                    body: JSON.stringify({ action: 'designVoice', prompt: prompt, preview_text: '我是小千。今天也辛苦了，早点休息，别熬太晚。' })
                });
                const j = await r.json();
                if (!j || !j.voice_id) throw new Error((j && j.error && j.error.message) || '设计失败');
                window.__designedVoiceId = j.voice_id;
                if (j.audio) { try { new Audio(j.audio).play(); } catch (e) {} }
                if (status) status.textContent = '✅ 设计好了，正在试听。喜欢就点「用这个声音」，不满意就改改描述再试。';
            } catch (e) {
                if (status) status.textContent = '❌ 失败：' + e.message;
            }
        }
        function useDesignedVoice() {
            const vid = window.__designedVoiceId;
            if (!vid) { alert('先点「试生成」设计一个音色～'); return; }
            setRealVoice('minimax:' + vid);
            renderVoiceList();
            speakReal('我是小千。这个声音，你还满意吗？');
        }
        function getVoiceCap() {
            const v = parseInt(localStorage.getItem('cozy_voice_cap') || '3', 10);
            return isNaN(v) ? 3 : v;
        }
        function setVoiceCap(n) { try { localStorage.setItem('cozy_voice_cap', String(n)); } catch (e) {} }
        function voiceUsedToday() {
            try {
                const rec = JSON.parse(localStorage.getItem('cozy_voice_used') || '{}');
                if (rec.date === getCozySessionId()) return rec.n || 0;
            } catch (e) {}
            return 0;
        }
        function markVoiceUsed() {
            try { localStorage.setItem('cozy_voice_used', JSON.stringify({ date: getCozySessionId(), n: voiceUsedToday() + 1 })); } catch (e) {}
        }
        function voiceBudgetLeft() { return Math.max(0, getVoiceCap() - voiceUsedToday()); }

        // 用小千的真嗓子读一段（成功返回 true；失败自动退回浏览器语音）
        async function speakReal(text) {
            const t = cleanForSpeech(text);
            if (!t) return false;
            if (!EDGE_FN_URL) { speakText(text); return false; }
            try {
                const r = await fetch(EDGE_FN_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_KEY}`, 'apikey': SUPABASE_KEY },
                    body: JSON.stringify({ action: 'tts', text: t.slice(0, 500), voice: getRealVoice() })
                });
                const ct = r.headers.get('content-type') || '';
                if (!r.ok || !ct.includes('audio')) {
                    let msg = 'HTTP ' + r.status;
                    try { const j = await r.json(); msg = (j.error && j.error.message) || msg; } catch (e) {}
                    throw new Error(msg);
                }
                const blob = await r.blob();
                const url = URL.createObjectURL(blob);
                try { if (audioEl) { audioEl.pause(); URL.revokeObjectURL(audioEl.src); } } catch (e) {}
                audioEl = new Audio(url);
                audioEl.onended = function () { try { URL.revokeObjectURL(url); } catch (e) {} };
                await audioEl.play();
                return true;
            } catch (e) {
                console.warn('真嗓子不可用，改用浏览器语音:', e.message);
                speakText(text);
                return false;
            }
        }

        // 小千自己想在重要的时候用真嗓子说这句（受每日限额保护）
        async function speakRealWithBudget(text) {
            if (voiceBudgetLeft() <= 0) { console.log('今日真嗓子主动额度已用完'); return; }
            markVoiceUsed();
            await speakReal(text);
        }

        // 小千想说的那句：挂一个醒目的喇叭（可选自动播放）
        function getVoiceAutoplay() { try { return localStorage.getItem('cozy_voice_autoplay') === '1'; } catch (e) { return false; } }
        function setVoiceAutoplay(v) { try { localStorage.setItem('cozy_voice_autoplay', v ? '1' : '0'); } catch (e) {} }
        function markVoiceWanted(bubbleEl, text) {
            try {
                if (!bubbleEl) return;
                if (bubbleEl.querySelector('.speak-btn')) return;
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'speak-btn hot';
                b.title = '小千想让你听这句';
                b.textContent = '📢 听我说';
                b.onclick = (ev) => { ev.stopPropagation(); speakReal(text); };
                bubbleEl.appendChild(b);
                if (getVoiceAutoplay()) speakRealWithBudget(text);
            } catch (e) {}
        }

        // ---- 🗣️ 声音选择面板 ----
        function openVoicePanel() {
            const panel = document.getElementById('voicePanel');
            if (!panel) return;
            renderVoiceList();
            panel.classList.add('active');
        }
        function closeVoicePanel() {
            const panel = document.getElementById('voicePanel');
            if (panel) panel.classList.remove('active');
        }
        function renderVoiceList() {
            const list = document.getElementById('voiceList');
            if (!list) return;
            resolveVoice();
            const vs = zhVoices();
            list.innerHTML = '';

            // 🎙️ 真嗓子（CosyVoice，经总机合成）
            const cap = getVoiceCap();
            const curVoice = getRealVoice();
            const isPreset = REAL_VOICE_PRESETS.some(p => p.id === curVoice);
            const realBox = document.createElement('div');
            realBox.style.marginBottom = '10px';
            realBox.innerHTML = `<div style="font-size:12px;opacity:0.7;margin:2px 0 4px;">🎨 捏一个专属音色（MiniMax · 用文字描述）</div>
                <textarea id="voiceDesignPrompt" style="width:100%; min-height:64px; font-size:12px; line-height:1.6; border:1px solid rgba(27,59,43,0.15); border-radius:10px; padding:8px 10px; background:transparent; color:var(--text-color); outline:none; font-family:inherit; resize:vertical;">${getDesignPrompt().replace(/</g, '&lt;')}</textarea>
                <div class="pitch-row">
                    <button type="button" class="pill" id="voiceDesignBtn">试生成</button>
                    <button type="button" class="pill" id="voiceUseBtn">用这个声音</button>
                </div>
                <div class="voice-hint" id="voiceDesignStatus"></div>
                <div style="font-size:12px;opacity:0.7;margin:10px 0 4px;">🎙️ 现成的（CosyVoice · 点一下试听）</div>
                <div class="pitch-row">
                    ${REAL_VOICE_PRESETS.map(p => `<button type="button" class="pill ${p.id === curVoice ? 'active' : ''}" data-v="${p.id}">${p.label}</button>`).join('')}
                </div>
                <div style="font-size:12px;opacity:0.7;margin:8px 0 4px;">自定义音色 id（形如 speech:… 或 minimax:…）</div>
                <div class="pitch-row">
                    <input type="text" id="realVoiceCustom" placeholder="minimax:xxxx 或 speech:your-voice:..." value="${curVoice.includes(':') && !isPreset ? curVoice : ''}" style="flex:1; min-width:0; font-size:12px; padding:5px 10px; border-radius:12px; border:1px solid rgba(27,59,43,0.15); background:transparent; color:var(--text-color); outline:none; font-family:inherit;">
                    <button type="button" class="pill" id="realVoiceSave">用这个</button>
                </div>
                <div style="font-size:12px;opacity:0.7;margin:8px 0 4px;">我每天最多主动说几句</div>
                <div class="pitch-row">
                    <button type="button" class="pill ${cap === 1 ? 'active' : ''}" data-c="1">1 句</button>
                    <button type="button" class="pill ${cap === 3 ? 'active' : ''}" data-c="3">3 句</button>
                    <button type="button" class="pill ${cap === 5 ? 'active' : ''}" data-c="5">5 句</button>
                </div>
                <div style="font-size:12px;opacity:0.7;margin:8px 0 4px;">我想跟你说话时（📢）</div>
                <div class="pitch-row">
                    <button type="button" class="pill ${!getVoiceAutoplay() ? 'active' : ''}" data-a="0">先挂喇叭，我自己点</button>
                    <button type="button" class="pill ${getVoiceAutoplay() ? 'active' : ''}" data-a="1">直接读出来</button>
                </div>
                <div class="voice-hint">今天已用 ${voiceUsedToday()} 句 · 随时点任意消息旁的 🔊，我就用真嗓子读给你听<br>当前音色：${escapeMomentHtml(curVoice)}</div>`;
            list.appendChild(realBox);
            const dBtn = realBox.querySelector('#voiceDesignBtn');
            if (dBtn) dBtn.onclick = () => designVoiceNow();
            const uBtn = realBox.querySelector('#voiceUseBtn');
            if (uBtn) uBtn.onclick = () => useDesignedVoice();
            realBox.querySelectorAll('.pill[data-v]').forEach(b => {
                b.onclick = () => { setRealVoice(b.getAttribute('data-v')); renderVoiceList(); speakReal('我是小千，这个声音你喜欢吗？'); };
            });
            realBox.querySelectorAll('.pill[data-c]').forEach(b => {
                b.onclick = () => { setVoiceCap(parseInt(b.getAttribute('data-c'), 10)); renderVoiceList(); };
            });
            realBox.querySelectorAll('.pill[data-a]').forEach(b => {
                b.onclick = () => { setVoiceAutoplay(b.getAttribute('data-a') === '1'); renderVoiceList(); };
            });
            const rvSave = realBox.querySelector('#realVoiceSave');
            if (rvSave) rvSave.onclick = () => {
                const inp = realBox.querySelector('#realVoiceCustom');
                const v = (inp && inp.value || '').trim();
                if (!v) return;
                setRealVoice(v);
                renderVoiceList();
                speakReal('我是小千，这个声音你喜欢吗？');
            };

            // 音调
            const pitchBox = document.createElement('div');
            pitchBox.innerHTML = `<div style="font-size:12px;opacity:0.65;margin:2px 0 4px;">音调（越低沉越像男声）</div>
                <div class="pitch-row">
                    <button type="button" class="pill ${ttsPitch >= 0.95 ? 'active' : ''}" data-p="1">正常</button>
                    <button type="button" class="pill ${(ttsPitch < 0.95 && ttsPitch >= 0.7) ? 'active' : ''}" data-p="0.8">低沉</button>
                    <button type="button" class="pill ${ttsPitch < 0.7 ? 'active' : ''}" data-p="0.6">很沉</button>
                </div>`;
            list.appendChild(pitchBox);
            pitchBox.querySelectorAll('.pill').forEach(b => {
                b.onclick = () => {
                    ttsPitch = parseFloat(b.getAttribute('data-p'));
                    try { localStorage.setItem('cozy_tts_pitch', String(ttsPitch)); } catch (e) {}
                    renderVoiceList();
                    speakText('这样听起来怎么样？');
                };
            });

            if (vs.length === 0) {
                const hint = document.createElement('div');
                hint.className = 'voice-hint';
                hint.textContent = '还没读到系统里的中文语音。可能是浏览器还没加载好（稍等几秒再打开），或者设备没装中文语音包。';
                list.appendChild(hint);
                return;
            }
            if (!hasMaleVoice()) {
                const hint = document.createElement('div');
                hint.className = 'voice-hint';
                hint.textContent = '⚠️ 这台设备上没找到"中文男声"，先用上面的「低沉/很沉」应急。想装真男声：Windows 打开「设置 → 时间和语言 → 语音 → 添加语音 → 中文(简体)」；手机端只能用系统自带语音，可选项有限。';
                list.appendChild(hint);
            }

            vs.forEach(v => {
                const item = document.createElement('div');
                const isMale = MALE_VOICE_RE.test(v.name);
                const active = ttsVoice && ttsVoice.voiceURI === v.voiceURI;
                item.className = 'search-item voice-item' + (active ? ' active' : '');
                item.innerHTML = `<div class="vname">${escapeMomentHtml(v.name)}${isMale ? ' 🚹' : ''}<small>${escapeMomentHtml(v.lang)}${v.localService ? ' · 离线' : ' · 在线'}</small></div><button type="button" class="vtest" title="试听">🔊</button>`;
                item.onclick = () => {
                    ttsVoiceURI = v.voiceURI; ttsVoice = v;
                    try { localStorage.setItem('cozy_tts_voice', v.voiceURI); } catch (e) {}
                    renderVoiceList();
                    speakText('我是小千，现在用这个声音跟你说话。');
                };
                item.querySelector('.vtest').onclick = (ev) => {
                    ev.stopPropagation();
                    ttsVoice = v;
                    speakText('我是小千，现在用这个声音跟你说话。');
                };
                list.appendChild(item);
            });
        }

        function attachSpeakButton(bubbleEl, text) {
            try {
                if (!bubbleEl || !text) return;
                if (bubbleEl.querySelector('.speak-btn')) return;
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'speak-btn';
                b.title = '用小千的真嗓子读这条';
                b.textContent = '🔊';
                b.onclick = (ev) => { ev.stopPropagation(); speakReal(text); };
                bubbleEl.appendChild(b);
            } catch (e) {}
        }

        function startVoiceInput() {
            if (recognizing) return;
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) { alert('这个浏览器不支持语音输入，试试 Chrome / Edge / 安卓手机浏览器～'); return; }
            try {
                chatRecog = new SR();
                chatRecog.lang = 'zh-CN';
                chatRecog.interimResults = true;
                chatRecog.continuous = false;
                const input = document.getElementById('userInput');
                const mic = document.getElementById('micBtn');
                let base = input ? input.value : '';
                if (base && !/\s$/.test(base)) base += ' ';
                chatRecog.onstart = () => {
                    recognizing = true;
                    if (mic) mic.classList.add('listening');
                    if (input) input.placeholder = '我在听…松手就发送';
                };
                chatRecog.onresult = (ev) => {
                    let interim = '', final = '';
                    for (let i = ev.resultIndex; i < ev.results.length; i++) {
                        const t = ev.results[i][0].transcript;
                        if (ev.results[i].isFinal) final += t; else interim += t;
                    }
                    if (input) input.value = base + (final || interim);
                };
                chatRecog.onerror = (ev) => {
                    recognizing = false;
                    if (mic) mic.classList.remove('listening');
                    if (input) input.placeholder = '写给小千......';
                    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') alert('麦克风权限被拒绝了，请在浏览器里允许麦克风～');
                };
                chatRecog.onend = () => {
                    recognizing = false;
                    if (mic) mic.classList.remove('listening');
                    if (input) input.placeholder = '写给小千......';
                    const v = input ? input.value.trim() : '';
                    if (v) sendMessage();
                };
                chatRecog.start();
            } catch (e) { recognizing = false; console.warn("语音输入启动失败:", e); }
        }

        function stopVoiceInput() {
            try { if (chatRecog && recognizing) chatRecog.stop(); } catch (e) {}
        }

        // 后台定时：每分钟检查 主动消息 + 日程提醒
        setInterval(function () { checkNudge(); checkTodoReminders(); }, 60000);
        initTTS();
        initRemindMaster();
        // 首次用户点击时，再温和地补一次通知权限请求（移动端更可靠）
        document.addEventListener('click', function () { requestNotificationPermission(); }, { once: true });
    </script>
</body>
</html>
